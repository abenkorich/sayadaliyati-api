name: sayadaliyati-api-runtime
services:
  api:
    build:
      context: .
      target: runtime
    image: sayadaliyati-api:dev
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server environment}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the server environment}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the server environment}
      DOCUMENT_STORAGE_ENDPOINT:
      DOCUMENT_STORAGE_BUCKET:
      DOCUMENT_STORAGE_REGION:
      DOCUMENT_STORAGE_ACCESS_KEY:
      DOCUMENT_STORAGE_SECRET_KEY:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - dev_data:/usr/src/app/dev_data
    stop_grace_period: 20s
  worker:
    image: sayadaliyati-api:dev
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server environment}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the server environment}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the server environment}
      DOCUMENT_STORAGE_ENDPOINT:
      DOCUMENT_STORAGE_BUCKET:
      DOCUMENT_STORAGE_REGION:
      DOCUMENT_STORAGE_ACCESS_KEY:
      DOCUMENT_STORAGE_SECRET_KEY:
    command: ['node', 'dist/reminders/main.js']
    volumes:
      - dev_data:/usr/src/app/dev_data
    healthcheck:
      disable: true
    stop_grace_period: 20s
volumes:
  dev_data:

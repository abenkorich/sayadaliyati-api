name: sayadaliyati-api-runtime
services:
  api:
    build:
      context: .
      target: runtime
    image: sayadaliyati-api:dev
    init: true
    restart: unless-stopped
    env_file: .env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - dev_data:/usr/src/app/dev_data
    stop_grace_period: 20s
  worker:
    image: sayadaliyati-api:dev
    init: true
    restart: unless-stopped
    env_file: .env.docker
    environment:
      NODE_ENV: production
    command:
      [
        'node',
        '--env-file-if-exists=/usr/src/app/dev_data/config/api.env',
        'dist/reminders/main.js',
      ]
    volumes:
      - dev_data:/usr/src/app/dev_data
    healthcheck:
      disable: true
    stop_grace_period: 20s
volumes:
  dev_data:

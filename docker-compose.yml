name: sayadaliyati-api

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: saydaliyati_owner
      POSTGRES_DB: saydaliyati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run pnpm setup:local first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saydaliyati_owner -d saydaliyati']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run pnpm setup:local first}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-56380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    profiles: ['documents']
    build: ./infrastructure/docker/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saydaliyati-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm setup:local first}
      MINIO_BROWSER: 'off'
    ports:
      - '127.0.0.1:${MINIO_PORT:-59001}:9000'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
